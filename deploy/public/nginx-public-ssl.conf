# Shelly Monitor public dashboard, HTTPS. Install as /etc/nginx/sites-available/shellymonitor-public-ssl
# and symlink into sites-enabled after the certificate exists. Requires the zones shelly_public and
# shelly_login (nginx-limit-zones.conf), the login sidecar on 127.0.0.1:18097 (shelly-monitor-auth.service)
# and the dashboard on 127.0.0.1:8787 (shelly-monitor serve).
#
# Backend routes (src/shelly_monitor/web.py):
#   GET/HEAD  /, /index.html, /api/{summary,report,daily,devices,homes,groups,device,custom-groups,config},
#             /api/{export.csv,report.csv,report.pdf,device.csv,device.pdf}
#   POST      /api/custom-groups                 (create/update a custom group)
#   PUT       /api/custom-groups/<id>/members    (set members)
#   DELETE    /api/custom-groups/<id>            (delete)
# Writes require X-Requested-With: shelly-monitor + application/json (CSRF guard in the backend);
# set SHELLY_WEB_READONLY=1 on the dashboard to refuse them (403) regardless of nginx.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shelly.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/shelly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shelly.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/shellymonitor.access.log;
    error_log  /var/log/nginx/shellymonitor.error.log;

    # Optional (only where kamehamewaf is installed: the snippets exist on this machine).
    # NB: a location with its own auth_request (the login gate below) replaces the server-level
    # kamehamewaf auth_request, so the WAF sensor does not inspect / and /api/custom-groups.
    # access_log /var/log/nginx/shellymonitor.json.log kamehamewaf_json;
    # include /etc/nginx/snippets/kamehamewaf-inline.conf;
    # include /etc/nginx/snippets/kamehamewaf-protect.conf;

    # Headers at server level. An add_header inside a location cancels the inherited ones:
    # locations with their own add_header repeat them.
    # No Content-Security-Policy here: the backend sends a strict one with the sha256 hashes of
    # its inline script/style, computed at startup from index.html (see docs/security-audit-2026-10-27.md).
    # The login page gets its CSP from the auth sidecar; /robots.txt sets its own below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1k;
    limit_req zone=shelly_public burst=50 nodelay;
    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The dashboard uses an inline data: favicon; a browser probing /favicon.ico just gets the login
    # redirect. Exempt it here with a location = /favicon.ico without auth_request if that bothers.

    # Internal cookie check (204 ok / 401 no)
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:18097/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:18097;
    }

    location @login {
        # nginx has no native urlencode: $request_uri is already in URI form (percent-encoded);
        # the sidecar reads everything after "next=" without splitting on ? and &.
        return 302 /login?next=$request_uri;
    }

    # Login page
    location = /login {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=shelly_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        # The page CSP comes from the sidecar (hashes of the inline blocks, form-action 'self'):
        # the other headers are repeated here but NOT the server CSP, otherwise both would apply.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:18097;
        proxy_set_header Host 127.0.0.1:18097;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18097;
        proxy_set_header Host 127.0.0.1:18097;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom groups: the only dashboard paths that accept writes (POST/PUT/DELETE, small JSON bodies).
    location ^~ /api/custom-groups {
        limit_except GET HEAD POST PUT DELETE { deny all; }
        auth_request /_auth;
        error_page 401 = @login;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the backend CSP (hashed, strict); hide the duplicates nginx already sets.
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 60s;
    }

    # Dashboard (read-only routes, exports included)
    location / {
        limit_except GET HEAD { deny all; }
        auth_request /_auth;
        error_page 401 = @login;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 60s;
    }
}
