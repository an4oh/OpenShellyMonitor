# Shelly Monitor public dashboard, plain HTTP: ACME challenge + redirect to HTTPS.
# Install as /etc/nginx/sites-available/shellymonitor-public, then symlink into sites-enabled.
# The 443 block is nginx-public-ssl.conf (enable it only after the certificate exists):
#   certbot certonly --webroot -w /var/www/certbot -d shelly.example.com
server {
    listen 80;
    listen [::]:80;
    server_name shelly.example.com;
    server_tokens off;
    access_log /var/log/nginx/shellymonitor.access.log;
    error_log  /var/log/nginx/shellymonitor.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 301 https://$host$request_uri; }
}
