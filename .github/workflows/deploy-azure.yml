name: Build and deploy to Azure Container Apps

# Every push to main builds the image, pushes it to GHCR and, when the repository
# variable AZURE_DEPLOY is 'true', rolls it out to Azure Container Apps.
# Setup: deploy/azure/README.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase) and tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/openshellymonitor" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME || 'shelly-monitor' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-shelly-monitor' }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the container app image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --only-show-errors \
            --query properties.latestRevisionName -o tsv

      - name: Wait for /healthz
        run: |
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://${fqdn}/healthz"
          curl -fsS --retry 20 --retry-delay 10 --retry-all-errors --max-time 10 \
            "https://${fqdn}/healthz"
          echo
          echo "Deployed $IMAGE to https://${fqdn}/" >> "$GITHUB_STEP_SUMMARY"

  deploy-skipped:
    needs: build
    if: vars.AZURE_DEPLOY != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          msg="Azure deploy skipped: repository variable AZURE_DEPLOY is not 'true'. The image was pushed to GHCR only. See deploy/azure/README.md."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
